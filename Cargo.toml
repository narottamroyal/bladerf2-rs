[package]
name = "bladerf2"
version = "0.1.0"
edition = "2024"
description = "Pure Rust bladeRF 2.0 micro driver on nusb with blocking and async interfaces, including WebUSB"
license = "MIT OR Apache-2.0"
repository = "https://github.com/narottamroyal/bladerf2-rs"
readme = "README.md"
keywords = ["sdr", "bladerf", "usb", "webusb", "radio"]

[features]
default = []
# Native async: enable exactly one so nusb can run blocking USB calls on a
# runtime. The blocking `.wait()` API needs neither, and neither does wasm.
smol = ["nusb/smol"]
tokio = ["nusb/tokio"]
# Hardware tests in tests/hardware.rs require a bladeRF 2.0 micro.
hardware-tests = []

[dependencies]
bytemuck = "1"
futures-lite = "2"
# The wasm-bindgen feature swaps in browser timers on wasm; inert on native.
futures-timer = { version = "3", features = ["wasm-bindgen"] }
nusb = "0.2.8"
num-complex = { version = "0.4", features = ["bytemuck"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
approx = { version = "0.5", features = ["num-complex"] }
serial_test = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
smol = "2"

[[example]]
name = "rx_async"
required-features = ["smol"]

[profile.test]
opt-level = 3
